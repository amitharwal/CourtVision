# Can a cloud machine reach stats.nba.com? GitHub's runners are Azure VMs, so this
# is a cheap stand-in for "will the NBA API work from a hosted server".
# As of Oct 2026 it can't (every endpoint times out), which is why the hosted site
# runs with COURTVISION_OFFLINE=1 and gets its data from a fetcher (see README).
# Runs weekly and on demand only, so a known block doesn't mark every PR red.
name: NBA API connectivity

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * 1"  # Mondays 14:00 UTC

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Call stats.nba.com from this runner
        env:
          NBA_TIMEOUT: "20"
        run: python scripts/check_nba_api.py
