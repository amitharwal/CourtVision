{% extends "base.html" %}

{% block title %}Compare Players{% endblock %}

{% block head %}
    <link rel="stylesheet" href="/static/css/compare.css">
{% endblock %}

{% block content %}

        <section class="page-header">
            <h2>Player Comparison Tool</h2>
            <p>Select up to 4 players to compare their stats side-by-side</p>
        </section>

        <section class="panel player-selection">
            <div class="selected-players" id="selected-players">
            </div>

            <div class="search-field">
                <input type="text" id="player-search" placeholder="Search for a player...">
                <div id="search-results" class="search-dropdown"></div>
            </div>
        </section>

        <section id="comparison-section" class="panel comparison-section" style="display: none;">
            <div class="season-selector">
                <label for="season-select">Season</label>
                <select id="season-select">
                    {% for season in seasons %}
                        <option value="{{ season }}">{{ season }}</option>
                    {% endfor %}
                </select>
                <select id="season-type" aria-label="Season type">
                    <option value="regular">Regular Season</option>
                    <option value="playoffs">Playoffs</option>
                </select>
                <button id="refresh-comparison" class="btn btn-secondary btn-sm">Refresh</button>
            </div>

            <div id="comparison-content" class="comparison-content">
                <!-- Comparison data will appear here -->
            </div>
        </section>
{% endblock %}

{% block scripts %}
    <script>
  let selectedPlayers = [];
  let playerStats      = {};

  document.addEventListener('DOMContentLoaded', () => {
    loadSavedPlayers();
    setupEventListeners();
  });

  function setupEventListeners() {
    document.getElementById('player-search')
      .addEventListener('input', debounce(searchPlayers, 300));
    document.getElementById('refresh-comparison')
      .addEventListener('click', loadComparison);
    document.getElementById('season-select')
      .addEventListener('change', loadComparison);
    document.getElementById('season-type')
      .addEventListener('change', loadComparison);

    // Close the search dropdown on an outside click or Escape
    const results = document.getElementById('search-results');
    document.addEventListener('click', e => {
      if (!e.target.closest('.search-field')) results.style.display = 'none';
    });
    document.getElementById('player-search').addEventListener('keydown', e => {
      if (e.key === 'Escape') results.style.display = 'none';
    });
  }

  // ?players=2544,201939&season=2024-25&type=playoffs overrides the saved list
  async function loadSavedPlayers() {
    UrlState.apply('season-select', 'season');
    UrlState.apply('season-type', 'type');
    const ids = (UrlState.get('players') || '').split(',').map(Number).filter(Boolean).slice(0, 4);
    const saved = ids.length
      ? (await UrlState.playerNames(ids)).map(p => ({ id: p.id, name: p.name }))
      : JSON.parse(localStorage.getItem('compareList') || '[]');
    saved.forEach(p => {
      if (selectedPlayers.length < 4) selectedPlayers.push(p);
    });
    if (ids.length) saveToLocalStorage();
    updateSelectedDisplay();
    if (selectedPlayers.length) loadComparison();
  }

  async function searchPlayers() {
    const q = document.getElementById('player-search').value;
    const out = document.getElementById('search-results');
    if (q.length < 2) return out.style.display = 'none';

    try {
      displaySearchResults(await SiteData.searchPlayers(q));
    } catch (e) {
      console.error(e);
    }
  }

  function displaySearchResults(list) {
    const out = document.getElementById('search-results');
    if (!list.length) {
      out.innerHTML = `<div class="no-results">No players found</div>`;
      return out.style.display = 'block';
    }
    out.replaceChildren(...list.map(p => UI.playerOption(p, () => addPlayer(p.id, p.name))));
    out.style.display = 'block';
  }

  function addPlayer(id, name) {
    if (selectedPlayers.find(p => p.id === id)) return UI.toast(`${name} is already in the comparison.`);
    if (selectedPlayers.length >= 4) return UI.toast('You can compare up to 4 players. Remove one first.', { kind: 'error' });
    selectedPlayers.push({ id, name });
    saveToLocalStorage();
    updateSelectedDisplay();
    document.getElementById('player-search').value = '';
    document.getElementById('search-results').style.display = 'none';
    loadComparison();
  }

  function removePlayer(id) {
    selectedPlayers = selectedPlayers.filter(p => p.id !== id);
    saveToLocalStorage();
    updateSelectedDisplay();
    if (selectedPlayers.length) loadComparison();
    else document.getElementById('comparison-section').style.display = 'none';
  }

  function updateSelectedDisplay() {
    UrlState.set({ players: selectedPlayers.map(p => p.id).join(',') });
    const c = document.getElementById('selected-players');
    if (!selectedPlayers.length) {
      c.innerHTML = `<div class="empty-state">No players selected…</div>`;
      return;
    }
    c.innerHTML = selectedPlayers.map((p,i) => `
      <div class="selected-player">
        ${NbaMedia.avatarHtml(p.id, p.name, 32)}
        <span class="player-name">${p.name}</span>
        <button class="remove-btn" onclick="removePlayer(${p.id})" aria-label="Remove ${p.name}">×</button>
      </div>
    `).join('')
      + (selectedPlayers.length<4 ? '<button type="button" class="add-slot" onclick="document.getElementById(\'player-search\').focus()">+ Add Player</button>' : '');
  }

  async function loadComparison() {
    if (!selectedPlayers.length) return;
    document.getElementById('comparison-section').style.display = 'block';
    const content = document.getElementById('comparison-content');
    // Keep the current comparison on screen, dimmed, while new stats load
    const refreshing = !!content.querySelector('.comparison-grid');
    if (refreshing) UI.refreshing(content, true);
    else UI.skeleton(content, 'rows', 10);
    const season = document.getElementById('season-select').value;
    const playoffs = document.getElementById('season-type').value === 'playoffs';
    const typeLabel = playoffs ? 'playoff' : 'regular-season';
    UrlState.set({ season, type: playoffs ? 'playoffs' : 'regular' });

    try {
      const results = await Promise.all(selectedPlayers.map(p => SiteData.get(`player/${p.id}.json`)));

      playerStats = {};
      const missing = [];
      results.forEach((res, idx) => {
        // Season rows from data/player/<id>.json; a traded player has one row per team
        // plus a combined "TOT" row, which is the one to compare.
        const seasonRows = (playoffs ? res.seasons_postseason : res.seasons_regular) || [];
        const rows = seasonRows.filter(r => r.SEASON_ID === season);
        const rec = rows.find(r => r.TEAM_ABBREVIATION === 'TOT') || rows[0];
        if (!rec) {
          missing.push(selectedPlayers[idx].name);
          return;
        }

        const GP = rec.GP || 1;
        // PPG/RPG/APG/SPG/BPG and TS_PCT come precomputed from the API;
        // PTS/FGA/etc. are season totals, TOV_TOTAL is the turnover total.
        rec.PFPG = (rec.PF || 0) / GP;
        const positive = (rec.PTS || 0) + (rec.REB || 0) + (rec.AST || 0) + (rec.STL || 0) + (rec.BLK || 0);
        const negative = ((rec.FGA || 0) - (rec.FGM || 0)) + ((rec.FTA || 0) - (rec.FTM || 0)) + (rec.TOV_TOTAL || 0);
        rec.EFF = (positive - negative) / GP;

        playerStats[selectedPlayers[idx].id] = rec;
      });

      if (missing.length === selectedPlayers.length) {
        content.innerHTML = `<div class="error">No ${season} ${typeLabel} stats for the selected players.</div>`;
        return;
      }
      displayComparison();
      if (missing.length) {
        const note = document.createElement('div');
        note.className = 'comparison-note';
        note.textContent = `No ${season} ${typeLabel} stats for: ${missing.join(', ')}`;
        content.prepend(note);
      }
    } catch (e) {
      console.error(e);
      if (refreshing) UI.toast('Failed to load player stats.', { kind: 'error' });
      else content.innerHTML = '<div class="error">Failed to load player stats</div>';
    } finally {
      UI.refreshing(content, false);
    }
  }

  function displayComparison() {
    const content = document.getElementById('comparison-content');
    const categories = [
      { name:'Basic Stats', stats:['GP','MIN','PPG','RPG','APG'] },
      { name:'Shooting',    stats:['FG_PCT','FG3_PCT','FT_PCT','TS_PCT'] },
      { name:'Defense',     stats:['SPG','BPG','PFPG'] },
      { name:'Advanced',    stats:['EFF'] }
    ];

    let html = `<div class="comparison-grid" style="--players: ${selectedPlayers.length}">`;
    // header
    html += '<div class="comparison-header-row"><div></div>';
    selectedPlayers.forEach(p => {
      const st = playerStats[p.id] || {};
      html += `
        <div class="player-header-cell">
          ${NbaMedia.avatarHtml(p.id, p.name, 64)}
          <div class="player-name">${p.name}</div>
          <div class="player-team">${st.TEAM_ABBREVIATION === 'TOT' ? 'Multiple teams' : (st.TEAM_ABBREVIATION || 'N/A')}</div>
        </div>`;
    });
    html += '</div>';

    // stats
    categories.forEach(cat => {
      html += `<div class="category-header">${cat.name}</div>`;
      cat.stats.forEach(stat => {
        const vals = selectedPlayers.map(p => playerStats[p.id]?.[stat] || 0);
        const maxv = Math.max(...vals);
        html += '<div class="stat-row">';
        html += `<div class="stat-label-cell">${formatStatName(stat)}</div>`;
        selectedPlayers.forEach(p => {
          const v = playerStats[p.id]?.[stat] || 0;
          const best = (v === maxv && v > 0) ? 'best-value' : '';
          html += `
            <div class="stat-value-cell ${best}">
              ${formatStatValue(stat, v)}
              ${stat.endsWith('_PCT') || stat==='TS_PCT'
                ? createBar(v, stat)
                : ''}
            </div>`;
        });
        html += '</div>';
      });
    });

    html += '</div>';
    content.innerHTML = html;
  }

  function formatStatName(stat) {
    const m = {
      'GP':'Games Played','MIN':'Minutes',
      'PPG':'PPG','RPG':'RPG','APG':'APG',
      'FG_PCT':'Field Goal %','FG3_PCT':'3‑Point %','FT_PCT':'Free Throw %','TS_PCT':'True Shooting %',
      'SPG':'Steals Per Game','BPG':'Blocks Per Game','PFPG':'Fouls Per Game',
      'EFF':'Efficiency Per Game'
    };
    return m[stat] || stat;
  }

  function formatStatValue(stat, v) {
    if (!v || isNaN(v)) return '0';
    if (stat==='FG_PCT' || stat==='FG3_PCT' || stat==='FT_PCT')
      return (v*100).toFixed(1) + '%';
    if (stat==='TS_PCT')
      return v.toFixed(1) + '%';
    if (['PPG','RPG','APG','SPG','BPG','PFPG','EFF'].includes(stat))
      return v.toFixed(1);
    if (['GP','MIN'].includes(stat))
      return v.toFixed(0);
    return v;
  }

  function createBar(v, stat) {
    // if decimal (<=1) -> multiply by 100
    let pct = (v <= 1 && stat!=='TS_PCT') ? (v*100) : v;
    pct = Math.min(100, pct);
    return `
      <div class="stat-bar">
        <div class="stat-bar-fill" style="width:${pct}%"></div>
      </div>
    `;
  }

  function saveToLocalStorage() {
    localStorage.setItem('compareList', JSON.stringify(selectedPlayers));
  }

  function debounce(fn, wait) {
    let t;
    return (...a) => {
      clearTimeout(t);
      t = setTimeout(() => fn(...a), wait);
    };
  }
</script>
{% endblock %}
