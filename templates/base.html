<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}{% if self.title() %} · {% endif %}Court Vision</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/logo.svg') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="container">
        <header>
            <a class="logo" href="{{ url_for('home') }}">
                <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="" width="32" height="32">
                Court Vision
            </a>
            <nav>
                {% for endpoint, label in nav_links %}
                <a href="{{ url_for(endpoint) }}"{% if endpoint == active_nav %} class="active"{% endif %}>{{ label }}</a>
                {% endfor %}
            </nav>
        </header>
        <main id="main" tabindex="-1">
{% block content %}{% endblock %}
        </main>
        <footer>
            © {{ current_year }} Court Vision • Built with Flask &amp; NBA API •
            <a href="https://github.com/amitharwal/CourtVision">GitHub</a> •
            <a href="{{ url_for('privacy_policy') }}">Privacy Policy</a>
        </footer>
    </div>
<script src="{{ url_for('static', filename='js/site-data.js') }}"></script>
<script src="{{ url_for('static', filename='js/url-state.js') }}"></script>
<script src="{{ url_for('static', filename='js/ui.js') }}"></script>
<script src="{{ url_for('static', filename='js/nba-media.js') }}"></script>
<script src="{{ url_for('static', filename='js/chart-theme.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
